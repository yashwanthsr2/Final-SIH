name: CyberSentinel CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-compliance:
    name: Code Quality & Passive Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Lint Syntax and Code Quality
        run: |
          flake8 backend ml tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Passive Compliance & Security
        env:
          PYTHONPATH: .
        run: |
          python tests/unit/test_security_audit.py

  backend-tests:
    name: Backend & Detector Pipeline Tests
    runs-on: ubuntu-latest
    needs: lint-and-compliance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Detector Suite
        env:
          PYTHONPATH: .
        run: |
          python tests/integration/test_six_detectors.py

      - name: Run Integration Pipeline Tests
        env:
          PYTHONPATH: .
        run: |
          python tests/integration/test_integration.py
          python tests/integration/test_canonical_pipeline_convergence.py

      - name: Run API Endpoints Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          python tests/e2e/test_all_apis.py

  docker-verification:
    name: Docker Build & Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend & Frontend Docker Images
        run: |
          docker compose build

