# CyberSentinel Development Configuration
environment: development
app:
  name: CyberSentinel
  version: 1.2.0
  model_version: v1.0
  debug: true
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:8000"
    - "*"

database:
  path: "db/cybersentinel.db"
  max_alerts: 50000

models:
  classifier_dir: "models/classifier"
  anomaly_dir: "models/anomaly"
  trajectory_dir: "models/trajectory"
  preprocessing_dir: "models/preprocessing"

passive_monitoring:
  enabled: true
  passive_only: true
  no_payload_decryption: true
  interface: ""
  default_window_seconds: 5
  baseline_auto_calibrate: true
